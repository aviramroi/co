# Fly.io config for the Wingman web app (public — terminates HTTPS, proxies to
# the agent over the Fly internal network).
#
# Deploy (after the agent app exists):
#   fly apps create wingman-web
#   fly secrets set -a wingman-web WINGMAN_API=http://wingman-agent.internal:4600
#   fly deploy -a wingman-web -c apps/wingman-web/fly.toml
app = "wingman-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Override with `fly secrets set WINGMAN_API=...` if your agent app is named differently.
  WINGMAN_API = "http://wingman-agent.internal:4600"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
